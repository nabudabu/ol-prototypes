<!DOCTYPE html>
<html lang="en">
<head>
    <!--
        Mini-Game #03: Drums of the Deep
        Curriculum: Phonological Awareness → Detection → Syllable Counting (CSV Row 20)
        Exercise: "1. Child hears multisyllable word. 2. Child taps the number of syllables."
        Input: Auditory | Output: Tactile (tap) | Feedback: Auditory + Visual
        Modality chain: Auditory → Tactile → Auditory
        Sample items: shneak(1), smaggle(2), discrete(2), enfogment(3), misdirection(4), invisible(4), intentionally(5)
        Notes: Uses real or nonsense words per CSV. Web Speech API for pronunciation.

        Difficulty progression (per curriculum-mapping.md):
          Rounds 1-2 (Supported): Word spoken + text displayed
          Rounds 3-5 (Reduced):   Word spoken + text shown briefly then fades
          Rounds 6-7 (Independent): Word spoken only, no text
    -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drums of the Deep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #05080f;
            color: #fff;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: 'Cinzel', Georgia, serif;
        }
        canvas { display: block; }

        /* Screens */
        .screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .screen.visible { opacity: 1; }

        /* Title */
        #title-screen {
            background: radial-gradient(ellipse at center, rgba(20,12,5,0.92), rgba(5,8,15,0.98));
        }
        #title-screen h1 {
            font-family: 'Cinzel Decorative', 'Cinzel', serif;
            font-size: clamp(26px, 7vw, 52px);
            letter-spacing: 4px;
            text-shadow: 0 0 40px rgba(255,160,40,0.6), 0 0 80px rgba(255,100,20,0.3);
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.3;
            color: #ffcc66;
        }
        #title-screen .subtitle {
            font-size: clamp(10px, 2.4vw, 13px);
            letter-spacing: 3px;
            color: rgba(255,190,100,0.45);
            margin-bottom: 36px;
            text-align: center;
            padding: 0 24px;
            text-transform: uppercase;
        }
        .prompt {
            font-size: clamp(12px, 3vw, 16px);
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: breathe 3s ease-in-out infinite;
            color: rgba(255,190,100,0.5);
        }

        /* Seal indicators */
        #seals-wrap {
            position: fixed;
            top: 7%;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 10px;
            z-index: 10;
            pointer-events: none;
        }
        .seal {
            width: 22px; height: 22px;
            border-radius: 50%;
            border: 2px solid rgba(255,160,50,0.25);
            background: rgba(255,160,50,0.04);
            transition: all 0.4s ease;
        }
        .seal.active {
            border-color: rgba(255,180,60,0.8);
            background: rgba(255,180,60,0.12);
            box-shadow: 0 0 10px rgba(255,160,50,0.4);
        }
        .seal.broken {
            border-color: rgba(100,255,140,0.6);
            background: rgba(100,255,140,0.15);
            box-shadow: 0 0 12px rgba(100,255,140,0.4);
        }
        .seal.failed {
            border-color: rgba(255,70,70,0.35);
            background: rgba(255,70,70,0.08);
        }

        /* Word display */
        #word-display {
            position: fixed;
            top: 17%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Cinzel Decorative', 'Cinzel', serif;
            font-size: clamp(22px, 6vw, 42px);
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #ffcc66;
            text-shadow: 0 0 25px rgba(255,160,40,0.5);
            z-index: 10;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            text-align: center;
        }
        #word-display.visible { opacity: 1; }
        #word-display.fading { opacity: 0; transition: opacity 1.5s ease; }

        /* Tap pips */
        #tap-counter {
            position: fixed;
            bottom: 24%;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 10px;
            z-index: 10;
            pointer-events: none;
        }
        .tap-pip {
            width: 14px; height: 14px;
            border-radius: 50%;
            background: rgba(255,190,80,0.8);
            box-shadow: 0 0 8px rgba(255,160,40,0.5);
            transform: scale(0);
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .tap-pip.active { transform: scale(1); }

        /* Instruction */
        #instruction {
            position: fixed;
            bottom: 14%;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(10px, 2.4vw, 13px);
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,190,100,0.35);
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #instruction.visible { opacity: 1; }

        /* Result screen */
        #result-screen {
            background: radial-gradient(ellipse at center, rgba(20,12,5,0.9), rgba(5,8,15,0.97));
        }
        #result-screen .result-label {
            font-family: 'Cinzel Decorative', 'Cinzel', serif;
            font-size: clamp(20px, 5.5vw, 38px);
            letter-spacing: 3px;
            margin-bottom: 16px;
            text-align: center;
        }
        #result-screen .result-score {
            font-size: clamp(38px, 10vw, 60px);
            letter-spacing: 6px;
            margin-bottom: 32px;
        }

        /* Exit button */
        #exit-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 44px; height: 44px;
            border: none;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
            font-family: 'Cinzel', Georgia, serif;
            font-size: 16px;
            color: rgba(255,255,255,0.35);
            cursor: pointer;
            z-index: 30;
            display: none;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            transition: opacity 0.3s ease, background 0.2s ease;
        }
        #exit-btn.visible { display: flex; }
        #exit-btn:active { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.7); }

        /* Loading */
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(5,8,15,0.95);
            color: rgba(255,190,100,0.4);
            font-size: 14px;
            letter-spacing: 4px;
            z-index: 50;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #loading.done { opacity: 0; }

        @keyframes breathe {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div id="loading">Loading...</div>
    <button id="exit-btn" aria-label="Exit game">&#x2715;</button>

    <div id="seals-wrap"></div>
    <div id="word-display"></div>
    <div id="tap-counter"></div>
    <div id="instruction">Tap the Beats</div>

    <div id="title-screen" class="screen visible">
        <h1>Drums of<br>the Deep</h1>
        <p class="subtitle">Tap the drum once for each syllable</p>
        <p class="prompt">Tap to Enter</p>
    </div>

    <div id="result-screen" class="screen">
        <div class="result-label" id="result-label">Seals Broken</div>
        <div class="result-score" id="result-score">5 / 7</div>
        <p class="prompt">Tap to Retry</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
    // ================================================================
    //  DRUMS OF THE DEEP — Mini-Game #03
    //  Curriculum: Phonological Awareness → Detection → Syllable Counting
    //  CSV Row 20: "Child hears multisyllable word. Child taps number of syllables."
    //  Modality: Auditory → Tactile → Auditory/Visual
    // ================================================================

    // ==================== CONFIG ====================
    // Word pool organized by syllable count.
    // CSV originals: shneak(1), smaggle(2), discrete(2), enfogment(3),
    //   misdirection(4), invisible(4), intentionally(5)
    // Extended with real + nonsense words per CSV note "Use real or nonsense words"
    const WORD_POOL = {
        1: ['shneak', 'flint', 'crumb', 'stalk', 'plunge', 'shrine', 'groft', 'dusk', 'scroll', 'branch'],
        2: ['smaggle', 'discrete', 'ancient', 'kingdom', 'crystal', 'portal', 'brimscot', 'puzzle', 'cauldron', 'phantom'],
        3: ['enfogment', 'discover', 'remember', 'dangerous', 'mystery', 'adventure', 'trillogen', 'enchantment', 'prisoner', 'origin'],
        4: ['misdirection', 'invisible', 'understanding', 'discovery', 'celebration', 'information', 'caterpillar', 'watermelon'],
        5: ['intentionally', 'communication', 'unbelievable', 'investigation', 'determination', 'imagination'],
    };
    // Syllable target per round — arrays mean pick randomly from those levels
    const ROUND_PLAN      = [1, 2, [2,3], 3, [3,4], 4, 5];
    const NUM_ROUNDS      = 7;
    const MAX_TAPS        = 6;
    const CONFIRM_DELAY   = 1.0;
    const TAP_TIMEOUT     = 8.0;
    const FEEDBACK_PAUSE  = 1.3;
    const CASCADE_TIME    = 2.5;
    const AUDIO_PATH      = 'audio/';
    const WORD_FADE_DELAY = 2.0;

    // ==================== STATE ====================
    let state          = 'loading';
    let stateTimer     = 0;
    let currentRound   = 0;
    let score          = 0;
    let tapCount       = 0;
    let timeSinceLastTap = 0;
    let speechDone     = false;
    let rounds         = [];
    let feedbackType   = '';
    let shakeAmount    = 0;
    let drumBounce     = 0;
    let drumGlowTarget = 0.15;
    let drumGlowCur    = 0.15;
    let wordFadeTimer  = -1;

    // ==================== THREE.JS SCENE ====================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05080f);
    scene.fog = new THREE.FogExp2(0x05080f, 0.035);

    const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 2.8, 5.2);
    camera.lookAt(0, 0.1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.prepend(renderer.domElement);

    // Lights
    const ambLight = new THREE.AmbientLight(0x1a0a05, 0.5);
    scene.add(ambLight);
    const keyLight = new THREE.PointLight(0xffaa44, 1.0, 20);
    keyLight.position.set(0, 5, -2);
    scene.add(keyLight);
    const fillLight = new THREE.PointLight(0x223366, 0.35, 15);
    fillLight.position.set(-3, -1, 4);
    scene.add(fillLight);

    // ==================== GROUND ====================
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(40, 40),
        new THREE.MeshStandardMaterial({ color: 0x0a0806, roughness: 0.95, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.55;
    scene.add(ground);

    const floorGlow = new THREE.Mesh(
        new THREE.CircleGeometry(2.2, 48),
        new THREE.MeshBasicMaterial({ color: 0x1a0f06, transparent: true, opacity: 0.25 })
    );
    floorGlow.rotation.x = -Math.PI / 2;
    floorGlow.position.y = -0.54;
    scene.add(floorGlow);

    // ==================== EMBER PARTICLES ====================
    const embers = (function() {
        const count = 80;
        const pos = new Float32Array(count * 3);
        const meta = [];
        for (let i = 0; i < count; i++) {
            pos[i*3]   = (Math.random() - 0.5) * 10;
            pos[i*3+1] = Math.random() * 7 - 1;
            pos[i*3+2] = (Math.random() - 0.5) * 8 - 1;
            meta.push({
                ySpeed: 0.15 + Math.random() * 0.4,
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.4 + Math.random() * 0.8,
                wobbleAmp: 0.08 + Math.random() * 0.15,
            });
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const pts = new THREE.Points(geo, new THREE.PointsMaterial({
            color: 0xff8833, size: 0.04, transparent: true, opacity: 0.45,
        }));
        scene.add(pts);
        return { pts, meta };
    })();

    // ==================== DRUM ====================
    const drum = (function() {
        const group = new THREE.Group();

        // Body
        const bodyGeo = new THREE.CylinderGeometry(1.0, 1.06, 0.45, 32);
        const bodyMat = new THREE.MeshStandardMaterial({
            color: 0x3a1e0c,
            roughness: 0.65,
            metalness: 0.25,
            emissive: 0x1a0a00,
            emissiveIntensity: 0.15,
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        group.add(body);

        // Top rim
        const rimGeo = new THREE.TorusGeometry(1.01, 0.045, 8, 48);
        const rimMat = new THREE.MeshStandardMaterial({
            color: 0xcc9933,
            roughness: 0.3,
            metalness: 0.8,
            emissive: 0x885511,
            emissiveIntensity: 0.2,
        });
        const rim = new THREE.Mesh(rimGeo, rimMat);
        rim.rotation.x = Math.PI / 2;
        rim.position.y = 0.225;
        group.add(rim);

        // Bottom rim
        const rimBot = rim.clone();
        rimBot.position.y = -0.225;
        group.add(rimBot);

        // Drum head
        const headGeo = new THREE.CircleGeometry(0.99, 48);
        const headMat = new THREE.MeshStandardMaterial({
            color: 0xccaa66,
            roughness: 0.45,
            metalness: 0.1,
            emissive: 0xffaa33,
            emissiveIntensity: 0.15,
            transparent: true,
            opacity: 0.75,
            side: THREE.DoubleSide,
        });
        const head = new THREE.Mesh(headGeo, headMat);
        head.rotation.x = -Math.PI / 2;
        head.position.y = 0.226;
        group.add(head);

        // Inner glow
        const light = new THREE.PointLight(0xffaa33, 0.6, 5);
        light.position.y = 0.5;
        group.add(light);

        // Rune ring (small floating stones around the drum)
        const runeStones = [];
        const stoneCount = 8;
        for (let i = 0; i < stoneCount; i++) {
            const angle = (i / stoneCount) * Math.PI * 2;
            const stoneGeo = new THREE.OctahedronGeometry(0.07, 0);
            const stoneMat = new THREE.MeshStandardMaterial({
                color: 0xddaa44,
                emissive: 0xaa7722,
                emissiveIntensity: 0.3,
                roughness: 0.2,
                metalness: 0.7,
            });
            const stone = new THREE.Mesh(stoneGeo, stoneMat);
            stone.position.set(Math.cos(angle) * 1.4, 0.15, Math.sin(angle) * 1.4);
            group.add(stone);
            runeStones.push({ mesh: stone, angle, baseY: 0.15 });
        }

        group.position.y = 0;
        scene.add(group);

        return { group, body, bodyMat, head, headMat, light, rim, rimMat, runeStones };
    })();

    // ==================== SHOCKWAVES ====================
    let shockwaves = [];

    function createShockwave(colorHex) {
        const geo = new THREE.RingGeometry(0.7, 0.95, 48);
        const mat = new THREE.MeshBasicMaterial({
            color: colorHex || 0xffaa33,
            transparent: true,
            opacity: 0.55,
            side: THREE.DoubleSide,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.rotation.x = -Math.PI / 2;
        mesh.position.copy(drum.group.position);
        mesh.position.y += 0.28;
        scene.add(mesh);
        shockwaves.push({ mesh, mat, life: 1.0 });
    }

    // ==================== EXPLOSIONS ====================
    let explosions = [];

    function createExplosion(pos, colorHex, count) {
        count = count || 30;
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const vels = [];
        for (let i = 0; i < count; i++) {
            positions[i*3] = pos.x; positions[i*3+1] = pos.y; positions[i*3+2] = pos.z;
            const th = Math.random() * Math.PI * 2;
            const ph = Math.acos(2 * Math.random() - 1);
            const sp = 1.2 + Math.random() * 3.5;
            vels.push(new THREE.Vector3(
                Math.sin(ph) * Math.cos(th) * sp,
                Math.sin(ph) * Math.sin(th) * sp * 0.6 + 1.5,
                Math.cos(ph) * sp * 0.4,
            ));
        }
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const mesh = new THREE.Points(geo, new THREE.PointsMaterial({
            color: colorHex, size: 0.08, transparent: true, opacity: 1,
        }));
        scene.add(mesh);
        explosions.push({ mesh, vels, life: 1.0 });
    }

    // ==================== FLASH PLANE ====================
    const flashPlane = (function() {
        const mat = new THREE.MeshBasicMaterial({
            color: 0xffffff, transparent: true, opacity: 0, depthTest: false,
        });
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), mat);
        mesh.position.z = 4;
        scene.add(mesh);
        return { mesh, mat };
    })();

    function triggerFlash(color, intensity) {
        flashPlane.mat.color.set(color);
        flashPlane.mat.opacity = intensity;
    }

    // ==================== AUDIO ====================
    let audioCtx = null;
    let droneOsc = null, droneGain = null;

    async function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        // iOS silent-mode unlock
        if (!initAudio._unlocked) {
            initAudio._unlocked = true;
            try {
                const a = new Audio();
                a.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
                a.volume = 0.01;
                await a.play().catch(() => {});
            } catch(e) {}
        }
    }

    function startDrone() {
        if (!audioCtx || droneOsc) return;
        droneOsc = audioCtx.createOscillator();
        droneGain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        droneOsc.type = 'sine';
        droneOsc.frequency.value = 65;
        filter.type = 'lowpass';
        filter.frequency.value = 100;
        droneGain.gain.value = 0;
        droneOsc.connect(filter);
        filter.connect(droneGain);
        droneGain.connect(audioCtx.destination);
        droneOsc.start();
        droneGain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 2);
    }

    function playDrumHit() {
        if (!audioCtx) return;
        const t = audioCtx.currentTime;

        // Low boom
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(120, t);
        osc1.frequency.exponentialRampToValueAtTime(45, t + 0.18);
        gain1.gain.setValueAtTime(0.45, t);
        gain1.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
        osc1.connect(gain1); gain1.connect(audioCtx.destination);
        osc1.start(t); osc1.stop(t + 0.45);

        // Click transient
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'square';
        osc2.frequency.value = 900;
        gain2.gain.setValueAtTime(0.12, t);
        gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.025);
        osc2.connect(gain2); gain2.connect(audioCtx.destination);
        osc2.start(t); osc2.stop(t + 0.03);

        // Body resonance
        const osc3 = audioCtx.createOscillator();
        const gain3 = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        osc3.type = 'triangle';
        osc3.frequency.value = 180;
        filter.type = 'bandpass';
        filter.frequency.value = 300;
        filter.Q.value = 2;
        gain3.gain.setValueAtTime(0.15, t);
        gain3.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc3.connect(filter); filter.connect(gain3); gain3.connect(audioCtx.destination);
        osc3.start(t); osc3.stop(t + 0.12);
    }

    function playSealBreak() {
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        [330, 440, 554, 660].forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            osc.connect(gain); gain.connect(audioCtx.destination);
            const st = t + i * 0.06;
            gain.gain.setValueAtTime(0, st);
            gain.gain.linearRampToValueAtTime(0.1, st + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, st + 1.0);
            osc.start(st); osc.stop(st + 1.0);
        });
    }

    function playSealHold() {
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        [90, 107].forEach(freq => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.value = freq;
            osc.connect(gain); gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.08, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
            osc.start(t); osc.stop(t + 0.35);
        });
    }

    function playCascadeChord(charge) {
        if (!audioCtx) return;
        const notes = [196, 262, 330, 392, 523];
        const count = Math.max(2, Math.round(charge * 5));
        notes.slice(0, count).forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            osc.connect(gain); gain.connect(audioCtx.destination);
            const st = audioCtx.currentTime + i * 0.12;
            gain.gain.setValueAtTime(0, st);
            gain.gain.linearRampToValueAtTime(0.08 * charge + 0.03, st + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, st + 2.2);
            osc.start(st); osc.stop(st + 2.2);
        });
    }

    // ==================== WORD AUDIO (pre-recorded MP3, Microsoft Ava Neural) ====================
    const wordBuffers = {};   // { word: AudioBuffer }
    let activeWord = null;    // { source, gain }

    // Collect every word from the pool for preloading
    function allWords() {
        const words = [];
        for (const k in WORD_POOL) WORD_POOL[k].forEach(w => words.push(w));
        return words;
    }

    async function loadWordAudio() {
        if (!audioCtx) return;
        const load = async (word) => {
            try {
                const resp = await fetch(AUDIO_PATH + word + '.mp3');
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                wordBuffers[word] = await audioCtx.decodeAudioData(await resp.arrayBuffer());
            } catch (err) {
                console.warn(`Failed to load ${word}.mp3:`, err);
            }
        };
        await Promise.all(allWords().map(load));
    }

    function speakWord(word) {
        stopWord();
        if (!audioCtx) return;
        const buffer = wordBuffers[word];
        if (!buffer) return;

        const gain = audioCtx.createGain();
        gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0.7, audioCtx.currentTime);

        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(gain);
        source.start();
        activeWord = { source, gain };
    }

    function stopWord() {
        if (!activeWord) return;
        const { source, gain } = activeWord;
        activeWord = null;
        const t = audioCtx.currentTime;
        gain.gain.cancelScheduledValues(t);
        gain.gain.setValueAtTime(gain.gain.value, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.08);
        setTimeout(() => {
            try { source.stop(); } catch(e) {}
            try { gain.disconnect(); } catch(e) {}
        }, 100);
    }

    // ==================== UI ====================
    const $title     = document.getElementById('title-screen');
    const $result    = document.getElementById('result-screen');
    const $resultLbl = document.getElementById('result-label');
    const $resultScr = document.getElementById('result-score');
    const $exitBtn   = document.getElementById('exit-btn');
    const $loading   = document.getElementById('loading');
    const $sealsWrap = document.getElementById('seals-wrap');
    const $wordDisp  = document.getElementById('word-display');
    const $tapCount  = document.getElementById('tap-counter');
    const $instr     = document.getElementById('instruction');

    // Build seal indicators
    const seals = [];
    for (let i = 0; i < NUM_ROUNDS; i++) {
        const el = document.createElement('div');
        el.className = 'seal';
        $sealsWrap.appendChild(el);
        seals.push(el);
    }

    // Build tap pips
    const pips = [];
    for (let i = 0; i < MAX_TAPS; i++) {
        const el = document.createElement('div');
        el.className = 'tap-pip';
        $tapCount.appendChild(el);
        pips.push(el);
    }

    function showScreen(el)  { el.classList.add('visible'); }
    function hideScreen(el)  { el.classList.remove('visible'); }

    function updateSealsUI() {
        seals.forEach((el, i) => {
            el.classList.remove('active', 'broken', 'failed');
            if (i === currentRound) el.classList.add('active');
        });
    }

    function markSeal(index, type) {
        seals[index].classList.remove('active');
        seals[index].classList.add(type);
    }

    function clearPips() {
        pips.forEach(p => p.classList.remove('active'));
    }

    function showPip(index) {
        if (index < pips.length) pips[index].classList.add('active');
    }

    function showWord(text, willFade) {
        $wordDisp.textContent = text;
        $wordDisp.classList.remove('fading');
        $wordDisp.classList.add('visible');
        wordFadeTimer = willFade ? WORD_FADE_DELAY : -1;
    }

    function hideWord() {
        $wordDisp.classList.remove('visible');
        $wordDisp.classList.add('fading');
        wordFadeTimer = -1;
    }

    function showInstruction() { $instr.classList.add('visible'); }
    function hideInstruction() { $instr.classList.remove('visible'); }

    // ==================== GAME LOGIC ====================
    // Track recently used words across games to avoid repeats within a session.
    // Each syllable level keeps a shuffled queue; once exhausted, it reshuffles.
    const wordQueues = {};
    function nextWord(syllables) {
        if (!wordQueues[syllables] || wordQueues[syllables].length === 0) {
            wordQueues[syllables] = [...WORD_POOL[syllables]].sort(() => Math.random() - 0.5);
        }
        return wordQueues[syllables].pop();
    }

    function generateRounds() {
        const usedThisGame = new Set();
        rounds = [];
        for (let i = 0; i < NUM_ROUNDS; i++) {
            const target = ROUND_PLAN[i];
            const syllables = Array.isArray(target)
                ? target[Math.floor(Math.random() * target.length)]
                : target;
            let word = nextWord(syllables);
            // If we somehow got a duplicate within this game, draw again
            let attempts = 0;
            while (usedThisGame.has(word) && attempts < 10) {
                word = nextWord(syllables);
                attempts++;
            }
            usedThisGame.add(word);
            rounds.push({ word, syllables });
        }
    }

    function startGame() {
        initAudio().then(() => startDrone());

        score = 0;
        currentRound = 0;
        generateRounds();

        hideScreen($title);
        hideScreen($result);
        $sealsWrap.style.display = 'flex';
        $tapCount.style.display = 'flex';
        $exitBtn.classList.add('visible');

        startRound();
    }

    function startRound() {
        state = 'speaking';
        stateTimer = 0;
        tapCount = 0;
        timeSinceLastTap = 0;
        speechDone = false;
        drumGlowTarget = 0.2;

        updateSealsUI();
        clearPips();
        hideInstruction();

        const rd = rounds[currentRound];

        // Difficulty progression: text support
        // Always show word (speech synthesis may fail on some words/devices)
        // but reduce display time as difficulty increases
        if (currentRound < 2) {
            showWord(rd.word, false);
        } else if (currentRound < 5) {
            showWord(rd.word, true);
        } else {
            showWord(rd.word, true);
            wordFadeTimer = 1.0;
        }

        // Speak the word (fire-and-forget — never block tapping)
        speakWord(rd.word);
        speechDone = true;
    }

    function evaluate() {
        stopWord();
        const rd = rounds[currentRound];
        const isCorrect = tapCount === rd.syllables;

        if (isCorrect) {
            feedbackType = 'correct';
            score++;
            markSeal(currentRound, 'broken');
            playSealBreak();

            const drumPos = drum.group.position.clone();
            drumPos.y += 0.3;
            createExplosion(drumPos, 0x66ff99, 25);
            createShockwave(0x66ffaa);
            triggerFlash(0x66ff99, 0.15);
            shakeAmount = 0.06;
        } else {
            feedbackType = 'wrong';
            markSeal(currentRound, 'failed');
            playSealHold();
            triggerFlash(0xff3344, 0.1);
            shakeAmount = 0.05;
        }

        hideWord();
        hideInstruction();
        state = 'feedback';
        stateTimer = 0;
    }

    function advanceRound() {
        currentRound++;
        if (currentRound >= NUM_ROUNDS) {
            startCascade();
        } else {
            startRound();
        }
    }

    function startCascade() {
        state = 'cascade';
        stateTimer = 0;
        hideWord();
        hideInstruction();
        $sealsWrap.style.display = 'none';
        $tapCount.style.display = 'none';

        const charge = score / NUM_ROUNDS;
        drumGlowTarget = charge;

        playCascadeChord(charge);

        const drumPos = drum.group.position.clone();
        drumPos.y += 0.3;
        const burstCount = Math.floor(15 + charge * 50);
        createExplosion(drumPos, 0xffaa33, burstCount);
        if (charge > 0.5) createExplosion(drumPos, 0xffdd66, burstCount / 2);
        for (let i = 0; i < Math.ceil(charge * 3); i++) {
            setTimeout(() => createShockwave(0xffcc44), i * 200);
        }
        triggerFlash(0xffaa33, 0.15 + charge * 0.3);
        shakeAmount = 0.06 + charge * 0.15;
    }

    function showResults() {
        state = 'results';
        $exitBtn.classList.remove('visible');

        if (score === NUM_ROUNDS) {
            $resultLbl.textContent = 'The Deep Awakens';
            $resultLbl.style.textShadow = '0 0 30px rgba(255,200,60,0.7)';
            $resultLbl.style.color = '#ffdd66';
            $resultScr.style.color = '#ffcc44';
        } else if (score >= 5) {
            $resultLbl.textContent = 'The Seals Weaken';
            $resultLbl.style.textShadow = '0 0 25px rgba(255,170,50,0.5)';
            $resultLbl.style.color = '#ffbb66';
            $resultScr.style.color = '#ddaa55';
        } else if (score >= 3) {
            $resultLbl.textContent = 'The Deep Stirs';
            $resultLbl.style.textShadow = '0 0 20px rgba(200,150,80,0.4)';
            $resultLbl.style.color = '#bbaa77';
            $resultScr.style.color = '#aa9966';
        } else {
            $resultLbl.textContent = 'The Deep Sleeps';
            $resultLbl.style.textShadow = '0 0 15px rgba(100,100,120,0.3)';
            $resultLbl.style.color = '#778899';
            $resultScr.style.color = '#667788';
        }
        $resultScr.textContent = `${score} / ${NUM_ROUNDS}`;
        showScreen($result);
    }

    function exitToTitle() {
        stopWord();
        state = 'title';
        $sealsWrap.style.display = 'none';
        $tapCount.style.display = 'none';
        $exitBtn.classList.remove('visible');
        hideWord();
        hideInstruction();
        showScreen($title);
        hideScreen($result);
    }

    // ==================== INPUT ====================
    document.addEventListener('pointerdown', function(e) {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (e.target === $exitBtn) return;
        e.preventDefault();

        switch (state) {
            case 'title':
                startGame();
                return;
            case 'results':
                startGame();
                return;
            case 'speaking':
            case 'tapping':
                // If still in speaking state, transition to tapping immediately
                if (state === 'speaking') {
                    state = 'tapping';
                    stateTimer = 0;
                    timeSinceLastTap = 0;
                    drumGlowTarget = 0.7;
                    showInstruction();
                }
                if (tapCount >= MAX_TAPS) return;
                tapCount++;
                timeSinceLastTap = 0;

                // Visual feedback
                showPip(tapCount - 1);
                drumBounce = 1.0;
                createShockwave(0xffaa33);

                // Audio feedback
                playDrumHit();

                // Auto-evaluate if max taps reached
                if (tapCount >= MAX_TAPS) {
                    evaluate();
                }
                return;
        }
    }, { passive: false });

    $exitBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        exitToTitle();
    });

    // ==================== RESIZE ====================
    window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });

    // ==================== MAIN LOOP ====================
    const clock = new THREE.Clock();
    const cameraBase = camera.position.clone();

    function update() {
        requestAnimationFrame(update);
        const dt = Math.min(clock.getDelta(), 0.1);
        const elapsed = clock.elapsedTime;
        stateTimer += dt;

        // --- Ember particles ---
        const ep = embers.pts.geometry.attributes.position.array;
        for (let i = 0; i < embers.meta.length; i++) {
            const m = embers.meta[i];
            ep[i*3+1] += m.ySpeed * dt;
            ep[i*3]   += Math.sin(elapsed * m.wobbleSpeed + m.wobble) * m.wobbleAmp * dt;
            if (ep[i*3+1] > 6) {
                ep[i*3+1] = -1;
                ep[i*3]   = (Math.random() - 0.5) * 10;
                ep[i*3+2] = (Math.random() - 0.5) * 8 - 1;
            }
        }
        embers.pts.geometry.attributes.position.needsUpdate = true;

        // --- Drum animation ---
        // Float bob
        const baseY = 0;
        const bobY = Math.sin(elapsed * 1.1) * 0.04;

        // Bounce decay
        if (drumBounce > 0.005) {
            drumBounce *= Math.pow(0.003, dt);
        } else {
            drumBounce = 0;
        }

        drum.group.position.y = baseY + bobY - drumBounce * 0.25;
        drum.group.rotation.y += dt * 0.08;

        // Glow
        drumGlowCur += (drumGlowTarget - drumGlowCur) * dt * 4;
        drum.headMat.emissiveIntensity = drumGlowCur + Math.sin(elapsed * 2.5) * drumGlowCur * 0.25;
        drum.light.intensity = 0.4 + drumGlowCur * 2.5;

        // Rune stones orbit
        drum.runeStones.forEach((rs, i) => {
            const a = rs.angle + elapsed * 0.15;
            rs.mesh.position.x = Math.cos(a) * 1.4;
            rs.mesh.position.z = Math.sin(a) * 1.4;
            rs.mesh.position.y = rs.baseY + Math.sin(elapsed * 1.5 + i * 0.8) * 0.06;
            rs.mesh.rotation.y += dt * 0.5;
        });

        // --- Shockwaves ---
        shockwaves = shockwaves.filter(sw => {
            sw.life -= dt * 2.2;
            sw.mat.opacity = Math.max(0, sw.life * 0.5);
            const s = 1 + (1 - sw.life) * 3.5;
            sw.mesh.scale.set(s, s, s);
            sw.mesh.position.y += dt * 0.4;
            if (sw.life <= 0) { scene.remove(sw.mesh); return false; }
            return true;
        });

        // --- Explosions ---
        explosions = explosions.filter(ex => {
            ex.life -= dt * 2.0;
            ex.mesh.material.opacity = Math.max(0, ex.life);
            const p = ex.mesh.geometry.attributes.position.array;
            for (let i = 0; i < ex.vels.length; i++) {
                p[i*3]   += ex.vels[i].x * dt;
                p[i*3+1] += ex.vels[i].y * dt;
                p[i*3+2] += ex.vels[i].z * dt;
                ex.vels[i].multiplyScalar(0.96);
                ex.vels[i].y -= dt * 2.0;
            }
            ex.mesh.geometry.attributes.position.needsUpdate = true;
            if (ex.life <= 0) { scene.remove(ex.mesh); return false; }
            return true;
        });

        // --- Flash decay ---
        if (flashPlane.mat.opacity > 0) {
            flashPlane.mat.opacity *= Math.pow(0.005, dt);
            if (flashPlane.mat.opacity < 0.003) flashPlane.mat.opacity = 0;
        }

        // --- Screen shake ---
        if (shakeAmount > 0.003) {
            camera.position.x = cameraBase.x + (Math.random() - 0.5) * shakeAmount;
            camera.position.y = cameraBase.y + (Math.random() - 0.5) * shakeAmount;
            shakeAmount *= Math.pow(0.01, dt);
        } else {
            shakeAmount = 0;
            camera.position.x = cameraBase.x;
            camera.position.y = cameraBase.y;
        }

        // --- Key light pulse ---
        keyLight.intensity = 1.0 + Math.sin(elapsed * 0.9) * 0.2 + drumGlowCur * 0.4;

        // --- Word fade timer ---
        if (wordFadeTimer > 0) {
            wordFadeTimer -= dt;
            if (wordFadeTimer <= 0) {
                $wordDisp.classList.add('fading');
                $wordDisp.classList.remove('visible');
                wordFadeTimer = -1;
            }
        }

        // --- State machine ---
        if (state === 'speaking' && speechDone) {
            state = 'tapping';
            stateTimer = 0;
            timeSinceLastTap = 0;
            drumGlowTarget = 0.7;
            showInstruction();
        }

        if (state === 'tapping') {
            timeSinceLastTap += dt;
            stateTimer += dt;

            // Drum "ready" pulse
            drumGlowTarget = 0.5 + Math.sin(elapsed * 3) * 0.15;

            // Auto-evaluate after confirm delay (only if at least one tap)
            if (tapCount > 0 && timeSinceLastTap >= CONFIRM_DELAY) {
                evaluate();
            }
            // Timeout with no taps — treat as 0 taps (wrong)
            else if (tapCount === 0 && stateTimer >= TAP_TIMEOUT) {
                evaluate();
            }
        }

        if (state === 'feedback') {
            drumGlowTarget = feedbackType === 'correct' ? 0.4 : 0.1;
            if (stateTimer >= FEEDBACK_PAUSE) {
                advanceRound();
            }
        }

        if (state === 'cascade' && stateTimer >= CASCADE_TIME) {
            showResults();
        }

        renderer.render(scene, camera);
    }

    // ==================== BOOT ====================
    async function boot() {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            await loadWordAudio();
        } catch (err) {
            console.warn('Audio loading failed:', err);
        }

        $loading.classList.add('done');
        state = 'title';
    }

    update();
    boot();
    </script>
</body>
</html>
